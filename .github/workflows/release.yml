name: release

# Cut a release by pushing a version tag:
#   npm version patch   # bumps package.json + creates the git tag
#   git push --follow-tags
# This workflow then (1) publishes to npm WITH PROVENANCE and (2) bumps the
# Homebrew formula in flashesofbrilliance/homebrew-tap to the new tag + sha256.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   NPM_TOKEN            npm *automation* granular token with publish rights to
#                        @flashesofbrilliance/rosetta-shell. Automation tokens
#                        bypass 2FA — required because CI cannot do passkey/OTP.
#   HOMEBREW_TAP_TOKEN   GitHub fine-grained PAT with Contents:write on the
#                        flashesofbrilliance/homebrew-tap repo.

on:
  push:
    tags: ["v*"]

jobs:
  npm-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # OIDC — required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag matches package.json version
        run: |
          set -e
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"; exit 1
          fi
      - name: Publish to npm (with provenance)
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  bump-formula:
    needs: npm-publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tap repo (auth handled by checkout)
        uses: actions/checkout@v4
        with:
          repository: flashesofbrilliance/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Bump Homebrew formula to the new tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          VER="${TAG#v}"
          URL="https://github.com/flashesofbrilliance/rosetta-shell/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | awk '{print $1}')
          echo "version=$VER url=$URL sha=$SHA"
          cd tap
          F="Formula/rosetta-shell.rb"
          sed -i -E "s#^  url \".*\"#  url \"${URL}\"#" "$F"
          sed -i -E "s#^  sha256 \".*\"#  sha256 \"${SHA}\"#" "$F"
          git config user.name "rosetta-release-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already current — nothing to do"
            exit 0
          fi
          git commit -am "rosetta-shell ${VER}: bump formula url + sha256"
          # The push needs HOMEBREW_TAP_TOKEN to carry Contents:write on the tap.
          # If it doesn't, DON'T fail the release (npm already published) — surface
          # a loud warning with the exact manual snippet instead.
          if git push; then
            echo "formula bumped + pushed to the tap"
          else
            echo "::warning title=Formula auto-bump failed::HOMEBREW_TAP_TOKEN lacks Contents:write on flashesofbrilliance/homebrew-tap. Run the manual bump below."
            echo "----- manual formula bump -----"
            echo "cd homebrew-tap && sed -i '' -E 's#^  url \".*\"#  url \"${URL}\"#;s#^  sha256 \".*\"#  sha256 \"${SHA}\"#' Formula/rosetta-shell.rb && git commit -am 'rosetta-shell ${VER}: bump formula' && git push"
            echo "-------------------------------"
          fi
